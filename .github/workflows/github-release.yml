name: GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    environment: crates-io-release
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest  , target: x86_64-unknown-linux-gnu       , use-cross: false , extension: "" }
          - { os: ubuntu-latest  , target: aarch64-unknown-linux-gnu      , use-cross: true  , extension: "" }
          - { os: macos-latest   , target: x86_64-apple-darwin            , use-cross: false , extension: "" }
          - { os: macos-latest   , target: aarch64-apple-darwin           , use-cross: false , extension: "" }
          - { os: windows-latest , target: x86_64-pc-windows-msvc         , use-cross: false , extension: .exe }
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: matrix.job.use-cross == true
        with:
          tool: cargo-cross
      - name: Build
        if: matrix.job.use-cross == false
        run: cargo build --release --target ${{ matrix.job.target }}
      - name: Build(cross)
        if: matrix.job.use-cross == true
        run: cargo cross build --release --target ${{ matrix.job.target }}
      - name: Rename artifacts
        run: |
          mv target/${{ matrix.job.target }}/release/${{ env.PROJECT_NAME }} ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.job.target }}${{ matrix.job.extension }}
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            target/${{ matrix.job.target }}/release/${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.job.target }}${{ matrix.job.extension }}
