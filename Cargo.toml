[package]
name = "kagami-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "This simple tool checks whether there are any publicly disclosed vulnerabilities in a list of defined software."
license = "MIT"
repository = "https://github.com/zunda-inc/kagami"
keywords = ["security", "vulnerability", "advisory", "ghsa", "cli"]
categories = ["command-line-utilities", "security"]

# `kagami` is taken on crates.io, so only the package is named `kagami-cli`; the library and the
# command keep the name `kagami`.
[lib]
name = "kagami"

[[bin]]
name = "kagami"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53.3", features = ["full"] }
yaml_serde = "0.10.7"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
simplelog = "0.12.2"
log = "0.4.34"
semver = "1.0.28"
octocrab = "0.54.5"
chrono = "0.4.45"
itertools = "0.15.0"
serde_json = "1.0.154"
console = "0.16.6"
strum_macros = "0.28.0"
regex = "1.13.1"
lenient_semver = { version = "0.4.2", features = ["semver"] }

[dev-dependencies]
rstest = "0.28.0"
